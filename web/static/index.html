<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OMS Sequence Builder</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>OMS Sequence Builder</h1>
    <p class="muted">Optimal Mean Setting for manufacturing with rework and scrap. The model runs on the server.</p>
  </header>
  <main>
    <section id="inputs" class="panel">
      <label>Preset
        <select id="preset"></select>
      </label>
      <p id="preset-description" class="muted"></p>
      <div class="actions file-actions">
        <button id="new" type="button" class="secondary">New</button>
        <button id="upload" type="button" class="secondary">Upload</button>
        <button id="download" type="button" class="secondary">Download</button>
        <input id="upload-file" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="sequence-editor"></div>
      <label>N parts started
        <input id="n-parts" type="number" value="10000" min="1" step="1">
      </label>
      <label>Optimise for
        <select id="objective">
          <option value="expected_profit">Expected Profit (maximum)</option>
          <option value="production_cost">Production cost (minimum)</option>
        </select>
      </label>
      <div class="actions">
        <button id="evaluate" type="button">Evaluate</button>
        <button id="optimise" type="button">Optimise</button>
        <button id="undo" type="button" class="secondary" hidden>Undo Optimise</button>
      </div>
    </section>
    <section id="outputs" class="panel">
      <div id="error" role="alert" hidden></div>
      <div id="diagram-wrap">
        <svg id="diagram" role="img" aria-label="Flow diagram of the Sequence"></svg>
        <div id="tooltip" hidden></div>
      </div>
      <table id="results" hidden></table>
    </section>
  </main>
</body>
</html>
